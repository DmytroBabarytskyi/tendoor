name: tendoor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendoor}
      POSTGRES_USER: ${POSTGRES_USER:-tendoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tendoor}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      TENDOOR_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-tendoor}:${POSTGRES_PASSWORD:-tendoor}@postgres:5432/${POSTGRES_DB:-tendoor}
      TENDOOR_MONGO_URI: mongodb://mongo:27017
      TENDOOR_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      TENDOOR_JWT_SECRET: ${TENDOOR_JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      TENDOOR_COOKIE_SECURE: ${TENDOOR_COOKIE_SECURE:-false}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["python", "-m", "tendoor.worker"]
    environment:
      TENDOOR_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-tendoor}:${POSTGRES_PASSWORD:-tendoor}@postgres:5432/${POSTGRES_DB:-tendoor}
      TENDOOR_MONGO_URI: mongodb://mongo:27017
      TENDOOR_MODEL_DIR: /data/models
    volumes: [models:/data/models]
    depends_on:
      api: { condition: service_started }  # api накочує міграції під час старту
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pg_data:
  mongo_data:
  models:
