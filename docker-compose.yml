name: tendoor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendoor}
      POSTGRES_USER: ${POSTGRES_USER:-tendoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tendoor}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      # mongosh — окремий процес Node.js (~1 с CPU на перевірку): часто лише під час старту,
      # далі раз на хвилину, інакше перевірки забирають помітну частку процесора
      start_period: 60s
      start_interval: 2s
      interval: 60s
      timeout: 10s
      retries: 5

  api:
    build: ./backend
    environment:
      TENDOOR_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-tendoor}:${POSTGRES_PASSWORD:-tendoor}@postgres:5432/${POSTGRES_DB:-tendoor}
      TENDOOR_MONGO_URI: mongodb://mongo:27017
      TENDOOR_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      TENDOOR_JWT_SECRET: ${TENDOOR_JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      TENDOOR_COOKIE_SECURE: ${TENDOOR_COOKIE_SECURE:-false}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["python", "-m", "tendoor.worker"]
    environment:
      TENDOOR_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-tendoor}:${POSTGRES_PASSWORD:-tendoor}@postgres:5432/${POSTGRES_DB:-tendoor}
      TENDOOR_MONGO_URI: mongodb://mongo:27017
      TENDOOR_MODEL_DIR: /data/models
    volumes: [models:/data/models]
    depends_on:
      api: { condition: service_started }  # api накочує міграції під час старту
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

  # навантажувальне тестування всередині мережі compose (без проксі портів Docker Desktop):
  #   TENDOOR_LOAD_PASSWORD=... docker compose --profile loadtest run --rm --no-deps locust -u 50 -r 5 -t 3m
  locust:
    image: locustio/locust:2.46.2
    profiles: [loadtest]
    working_dir: /mnt/loadtest
    volumes: [./loadtest:/mnt/loadtest]
    environment:
      TENDOOR_LOAD_EMAIL: ${TENDOOR_LOAD_EMAIL:-loadtest@tendoor.dev}
      TENDOOR_LOAD_PASSWORD: ${TENDOOR_LOAD_PASSWORD:-}
    entrypoint: ["locust", "-f", "locustfile.py", "--host", "http://frontend", "--headless", "--only-summary",
                 "--csv", "results/run", "--html", "results/report.html"]
    depends_on: [frontend]

volumes:
  pg_data:
  mongo_data:
  models:
